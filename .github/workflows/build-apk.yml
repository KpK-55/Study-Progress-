name: Build Android APK & Deploy PWA

on:
push:
branches: [ main, master ]
workflow_dispatch:

jobs:
build-android-apk:
runs-on: ubuntu-latest

steps:
  - name: Checkout Repository
    uses: actions/checkout@v4

  - name: Setup Node.js 20
    uses: actions/setup-node@v4
    with:
      node-version: "20"

  - name: Setup Java 17 (Required for Android Gradle)
    uses: actions/setup-java@v4
    with:
      distribution: "temurin"
      java-version: "17"

  - name: Generate PNG App Icons
    run: node generate-icons.js

  - name: Assemble Web Bundle & Capacitor Android Project
    run: |
      mkdir -p www
      cp index.html manifest.json sw.js icon-192.png icon-512.png www/
      npm init -y
      npm install @capacitor/core @capacitor/cli @capacitor/android
      npx cap init "NEET 2027 Workspace" "com.neet2027.workspace" --web-dir=www
      npx cap add android
      mkdir -p android/app/src/main/res/drawable
      cp icon-512.png android/app/src/main/res/drawable/ic_launcher.png
      npx cap copy android

  - name: Build Debug APK with Gradle
    run: |
      cd android
      chmod +x gradlew
      ./gradlew assembleDebug

  - name: Upload Installable Android APK Artifact
    uses: actions/upload-artifact@v4
    with:
      name: NEET-2027-Workspace-Android-APK
      path: android/app/build/outputs/apk/debug/app-debug.apk
      retention-days: 30
